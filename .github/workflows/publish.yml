name: Publish to npm

# Publishes when a v* tag is pushed.
#
# First release (package.json is already 0.1.0 - do NOT run `npm version`, which would
# bump it to 0.1.1 and skip 0.1.0):
#   git tag v0.1.0 && git push origin v0.1.0
#
# Every release after that:
#   npm version patch|minor|major && git push --follow-tags
#
# Before the first run: the repo must be PUBLIC (npm rejects --provenance from a private
# repo), and an NPM_TOKEN repo secret must exist (or npm trusted publishing configured).
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Typecheck, lint and the full test suite. GitHub's ubuntu runners ship cargo, so the
      # Rust lesson tests run here too (they skip only where cargo is missing).
      - run: npm run verify

      # A tag must match package.json, or the published version and the tag disagree.
      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($expected)"; exit 1
          fi

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
