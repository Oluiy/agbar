name: Publish to npm

# Publishes when a v* tag is pushed, so releasing is:
#   npm version patch|minor|major && git push --follow-tags
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Rust isn't installed here, so the cargo-dependent checker tests skip
      # themselves (see rustChecker.test.ts) rather than failing the release.
      - run: npm run verify

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
