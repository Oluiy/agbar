# Ordered paths through content that already exists. Adding a track is data,
# never code. Teams can ship their own by pointing BUILDQUICK_CONTENT (or
# .buildquickrc's "contentDir") at a directory with its own tracks.yaml.
tracks:
  - id: "first-steps"
    title: "First steps: from config files to code you can change"
    audience: "Beginners - if you're not sure where to start, start here"
    description: "Each step only needs the one before it. It starts with the files every project has (YAML, CI), then the three mistakes check finds most often, then practice that's graded for real - so you finish having done things, not just read them."
    steps:
      - unit: "yaml/01-yaml-that-means-what-you-think"
      - unit: "yaml/02-github-actions-behind-the-scenes"
      - unit: "regex/01-anchors-and-escapes"
      - concept: "secrets-management"
      - concept: "timeouts"
      - concept: "single-responsibility"
      - unit: "refactoring/01-extract-the-domain"
      - concept: "dependency-inversion"
      - unit: "refactoring/02-depend-on-an-interface"
      - concept: "rate-limiting"
      - unit: "algorithms/01-token-bucket"
      - unit: "yaml/03-cron-schedules"

  - id: "production-traps"
    title: "Small traps that break production"
    audience: "Every developer - beginners especially, because nobody warns you about these"
    description: "Production rarely falls over from a slow algorithm. It breaks on the small things: text that looks equal and isn't, money in floats, IDs that change in JSON, days that aren't 24 hours, a file name that escapes its folder. Each lesson here makes you predict the surprising output and then fix the bug."
    steps:
      - unit: "traps/01-text-traps"
      - concept: "invisible-characters"
      - concept: "locale-case-mapping"
      - unit: "traps/02-number-traps"
      - concept: "big-integer-ids"
      - concept: "rounding-modes"
      - unit: "traps/03-time-traps"
      - concept: "monotonic-clocks"
      - concept: "week-based-year"
      - unit: "traps/04-api-and-file-traps"
      - concept: "sql-null-logic"
      - concept: "timing-attacks"
      - concept: "ssrf"
      - concept: "non-atomic-updates"
      - concept: "captive-dependencies"
      - unit: "regex/03-regex-that-bites"

  - id: "architecture-decisions"
    title: "Decisions you can't cheaply undo"
    audience: "Anyone choosing an architecture, not just implementing one"
    description: "The calls that are cheap now and expensive in eighteen months. Each of these has a real 'when to use it' - and, more usefully, a 'when not to'."
    steps:
      - concept: "microservices-vs-monolith"
      - concept: "choosing-the-datastore"
      - concept: "communication-patterns"
      - concept: "cap-theorem"
      - concept: "multi-tenancy"
      - concept: "schema-migrations"
      - concept: "api-versioning"

  - id: "distributed-writes"
    title: "Writes that span more than one system"
    audience: "Engineers whose service has to tell another service something happened"
    description: "What happens when a database commit and a message publish can't be one atomic step - and the patterns that make it survivable."
    steps:
      - concept: "transactional-outbox"
      - concept: "idempotency-keys"
      - concept: "saga-pattern"
      - concept: "message-queues"
      - concept: "dead-letter-queues"
      - concept: "reconciliation"

  - id: "caching-in-depth"
    title: "Caching, past the first day"
    audience: "Anyone who has added a cache and now has new problems"
    description: "A cache is easy to add and easy to get wrong. Cold starts, stampedes, and the eviction policy you didn't choose on purpose."
    steps:
      - concept: "caching"
      - concept: "cache-warming"
      - concept: "cache-stampede"
      - unit: "algorithms/03-lru-cache"
      - concept: "statelessness"

  - id: "student-backend"
    title: "Backend fundamentals"
    audience: "Students and self-taught developers"
    description: "The concepts that separate a working CRUD API from one that survives real traffic, in roughly the order they bite you."
    steps:
      - concept: "choosing-the-datastore"
      - concept: "database-indexing"
      - concept: "n-plus-one-queries"
      - concept: "pagination"
      - concept: "caching"
      - concept: "api-versioning"
      - concept: "statelessness"
      - concept: "security-by-design"
      - concept: "secrets-management"
      - concept: "rate-limiting"
      - concept: "observability"

  - id: "production-readiness"
    title: "Production readiness review"
    audience: "DevOps, platform, and SRE"
    description: "What to verify before a service takes real traffic, and what to have in place before it degrades."
    steps:
      - concept: "observability"
      - concept: "backups-vs-replication"
      - concept: "replication"
      - concept: "connection-pooling"
      - concept: "rate-limiting"
      - concept: "retry-mechanisms"
      - concept: "circuit-breakers"
      - concept: "bulkhead-pattern"
      - concept: "backpressure"
      - concept: "dead-letter-queues"
      - concept: "distributed-locks"
      - concept: "secrets-management"

  - id: "interview-prep"
    title: "System design interview"
    audience: "Anyone interviewing for a backend or platform role"
    description: "The concepts that come up most in system design rounds, with the tradeoff framing interviewers actually listen for."
    steps:
      - concept: "cap-theorem"
      - concept: "choosing-the-datastore"
      - concept: "database-indexing"
      - concept: "caching"
      - concept: "message-queues"
      - concept: "communication-patterns"
      - concept: "statelessness"
      - concept: "replication"
      - concept: "rate-limiting"
      - concept: "idempotency-keys"
      - concept: "concurrency-control"
      - concept: "multi-tenancy"

  - id: "new-hire-onboarding"
    title: "New hire onboarding"
    audience: "Seniors onboarding a junior onto a real codebase"
    description: "The shortlist worth handing someone in week one, so the same review comments stop getting written by hand."
    steps:
      - concept: "security-by-design"
      - concept: "secrets-management"
      - concept: "observability"
      - concept: "idempotency-keys"
      - concept: "n-plus-one-queries"
      - concept: "pagination"
      - concept: "concurrency-control"
      - concept: "api-versioning"

  - id: "well-structured-code"
    title: "Code you can still change in six months"
    audience: "Anyone maintaining code they (or an AI) wrote quickly"
    description: "The structural principles, then refactoring exercises where the tests only pass if you actually pulled the code apart. Aimed at the difference between code that runs and code a person can modify."
    steps:
      - concept: "separation-of-concerns"
      - unit: "refactoring/01-extract-the-domain"
      - concept: "dependency-inversion"
      - unit: "refactoring/02-depend-on-an-interface"
      - concept: "single-responsibility"
      - concept: "coupling-and-cohesion"
      - concept: "dry-principle"

  - id: "systems-algorithms"
    title: "Algorithms that actually ship in backends"
    audience: "Backend engineers who want the mechanism, not the summary"
    description: "Read the concept, then implement the algorithm behind it and have real tests judge it. Not interview puzzles - the code that runs in production rate limiters, caches, and shards."
    steps:
      - concept: "rate-limiting"
      - unit: "algorithms/01-token-bucket"
      - concept: "retry-mechanisms"
      - unit: "algorithms/02-exponential-backoff"
      - concept: "caching"
      - unit: "algorithms/03-lru-cache"
      - concept: "replication"
      - unit: "algorithms/04-consistent-hashing"

  - id: "rust-basics"
    title: "Rust from scratch"
    audience: "Anyone new to Rust"
    description: "Hands-on units with real cargo checks, ending at ownership - the concept everything else in Rust depends on."
    steps:
      - unit: "rust/01-getting-started"
      - unit: "rust/03-common-concepts"
      - unit: "rust/04-ownership-basics"
